<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Food, desks and little everyday moments. Tap a photo to enlarge it.">
  <title data-i18n="gallery.title">Gallery — Hoang Minh Phuong</title>
  <link rel="icon" href="../logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;900&family=Noto+Serif:ital,wght@0,400;0,600;0,700;1,400&family=Noto+Serif+JP:wght@400;700&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/header-footer.css">
  <link rel="stylesheet" href="../css/pages.css">
</head>

<body>
  <div id="header"></div>

  <main class="container page">
    <header class="page-head">
      <h1 data-i18n="gallery.h">Gallery</h1>
      <p class="page-sub" data-i18n="gallery.sub">Food, desks and little everyday moments. Tap a photo to enlarge it.</p>
    </header>

    <div class="filters" role="group" aria-label="Category">
      <button type="button" class="filter-btn active" data-filter="all"><span data-i18n="cat.all">All</span></button>
      <button type="button" class="filter-btn" data-filter="cooking"><span data-i18n="cat.cooking">Cooking</span></button>
      <button type="button" class="filter-btn" data-filter="tech"><span data-i18n="cat.tech">Tech</span></button>
      <button type="button" class="filter-btn" data-filter="life"><span data-i18n="cat.life">Life</span></button>
    </div>

    <div class="gallery-masonry" id="gallery-grid">
      <figure class="gallery-item" data-cat="cooking">
        <button type="button" class="gallery-open" data-full="../images/pizza.jpg">
          <img src="../images/thumbs/pizza.jpg" alt="Homemade pizza" data-i18n-alt="g.1" loading="lazy">
        </button>
        <figcaption data-i18n="g.1">Homemade pizza</figcaption>
      </figure>
      <figure class="gallery-item" data-cat="cooking">
        <button type="button" class="gallery-open" data-full="../images/soba.jpg">
          <img src="../images/thumbs/soba.jpg" alt="A bowl of soba" data-i18n-alt="g.2" loading="lazy">
        </button>
        <figcaption data-i18n="g.2">A bowl of soba</figcaption>
      </figure>
      <figure class="gallery-item" data-cat="cooking">
        <button type="button" class="gallery-open" data-full="../images/soba1.jpg">
          <img src="../images/thumbs/soba1.jpg" alt="More soba" data-i18n-alt="g.3" loading="lazy">
        </button>
        <figcaption data-i18n="g.3">More soba</figcaption>
      </figure>
      <figure class="gallery-item" data-cat="cooking">
        <button type="button" class="gallery-open" data-full="../images/cook1.jpg">
          <img src="../images/thumbs/cook1.jpg" alt="From my kitchen, no. 1" data-i18n-alt="g.4" loading="lazy">
        </button>
        <figcaption data-i18n="g.4">From my kitchen, no. 1</figcaption>
      </figure>
      <figure class="gallery-item" data-cat="cooking">
        <button type="button" class="gallery-open" data-full="../images/cook2.jpg">
          <img src="../images/thumbs/cook2.jpg" alt="From my kitchen, no. 2" data-i18n-alt="g.5" loading="lazy">
        </button>
        <figcaption data-i18n="g.5">From my kitchen, no. 2</figcaption>
      </figure>
      <figure class="gallery-item" data-cat="cooking">
        <button type="button" class="gallery-open" data-full="../images/cook3.jpg">
          <img src="../images/thumbs/cook3.jpg" alt="From my kitchen, no. 3" data-i18n-alt="g.6" loading="lazy">
        </button>
        <figcaption data-i18n="g.6">From my kitchen, no. 3</figcaption>
      </figure>
      <figure class="gallery-item" data-cat="tech">
        <button type="button" class="gallery-open" data-full="../images/maytinh1.jpg">
          <img src="../images/thumbs/maytinh1.jpg" alt="A corner for working" data-i18n-alt="g.7" loading="lazy">
        </button>
        <figcaption data-i18n="g.7">A corner for working</figcaption>
      </figure>
      <figure class="gallery-item" data-cat="tech">
        <button type="button" class="gallery-open" data-full="../images/maytinh2.jpg">
          <img src="../images/thumbs/maytinh2.jpg" alt="A cow at the computer, with bubble tea" data-i18n-alt="g.8" loading="lazy">
        </button>
        <figcaption data-i18n="g.8">A cow at the computer, with bubble tea</figcaption>
      </figure>
      <figure class="gallery-item" data-cat="life">
        <button type="button" class="gallery-open" data-full="../images/anh1.jpg">
          <img src="../images/thumbs/anh1.jpg" alt="Window-shopping" data-i18n-alt="g.9" loading="lazy">
        </button>
        <figcaption data-i18n="g.9">Window-shopping</figcaption>
      </figure>
      <figure class="gallery-item" data-cat="life">
        <button type="button" class="gallery-open" data-full="../images/anh2.jpg">
          <img src="../images/thumbs/anh2.jpg" alt="Out and about in Koshigaya" data-i18n-alt="g.10" loading="lazy">
        </button>
        <figcaption data-i18n="g.10">Out and about in Koshigaya</figcaption>
      </figure>
      <figure class="gallery-item" data-cat="life">
        <button type="button" class="gallery-open" data-full="../images/avatar.jpg">
          <img src="../images/thumbs/avatar.jpg" alt="A winter walk" data-i18n-alt="g.11" loading="lazy">
        </button>
        <figcaption data-i18n="g.11">A winter walk</figcaption>
      </figure>
      <figure class="gallery-item" data-cat="life">
        <button type="button" class="gallery-open" data-full="../images/tansho1.jpg">
          <img src="../images/thumbs/tansho1.jpg" alt="A quiet moment" data-i18n-alt="g.12" loading="lazy">
        </button>
        <figcaption data-i18n="g.12">A quiet moment</figcaption>
      </figure>
      <figure class="gallery-item" data-cat="life">
        <button type="button" class="gallery-open" data-full="../images/tansho2.jpg">
          <img src="../images/thumbs/tansho2.jpg" alt="Lost in thought" data-i18n-alt="g.13" loading="lazy">
        </button>
        <figcaption data-i18n="g.13">Lost in thought</figcaption>
      </figure>
    </div>
  </main>

  <div class="lightbox" id="lightbox" hidden>
    <button type="button" class="lightbox-close" aria-label="Close" data-i18n-aria="gallery.close">&times;</button>
    <img src="" alt="">
    <p class="lightbox-caption"></p>
  </div>

  <div id="footer"></div>
  <script src="../js/translations.js"></script>
  <script src="../js/i18n.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/pages.js"></script>
</body>

</html>
