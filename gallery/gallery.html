<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Food, desks and little everyday moments. Tap a photo to enlarge it.">
  <title data-i18n="gallery.title">Gallery — Hoang Minh Phuong</title>
  <script>document.documentElement.classList.add('js');try{var t=localStorage.getItem('theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
  <link rel="icon" href="../favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <link rel="manifest" href="../site.webmanifest">
  <meta name="theme-color" content="#efe0b8">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Phuong's Blog">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=EB+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Noto+Serif+JP:wght@400;700&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"></noscript>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/header-footer.css">
  <link rel="stylesheet" href="../css/pages.css">
  <link rel="stylesheet" href="../css/extras.css">
</head>

<body>
  <div id="header"></div>

  <main class="container page">
    <header class="page-head">
      <h1 data-i18n="gallery.h">Gallery</h1>
      <p class="page-sub" data-i18n="gallery.sub">Food, desks and little everyday moments. Tap a photo to enlarge it.</p>
    </header>

    <div class="filters" role="group" aria-label="Category">
      <button type="button" class="filter-btn active" data-filter="all"><span data-i18n="cat.all">All</span></button>
      <button type="button" class="filter-btn" data-filter="cooking"><span data-i18n="cat.cooking">Cooking</span></button>
      <button type="button" class="filter-btn" data-filter="tech"><span data-i18n="cat.tech">Tech</span></button>
      <button type="button" class="filter-btn" data-filter="life"><span data-i18n="cat.life">Life</span></button>
    </div>

    <div class="gallery-masonry" id="gallery-grid">
      <figure class="gallery-item" data-cat="cooking">
        <button type="button" class="gallery-open" data-full="../images/w1600/pizza.webp">
          <img src="../images/w800/pizza.webp" width="600" height="800" alt="Homemade pizza" data-i18n-alt="g.1" loading="lazy" decoding="async">
        </button>
        <figcaption data-i18n="g.1">Homemade pizza</figcaption>
      </figure>
      <figure class="gallery-item" data-cat="cooking">
        <button type="button" class="gallery-open" data-full="../images/w1600/soba.webp">
          <img src="../images/w800/soba.webp" width="600" height="800" alt="A bowl of soba" data-i18n-alt="g.2" loading="lazy" decoding="async">
        </button>
        <figcaption data-i18n="g.2">A bowl of soba</figcaption>
      </figure>
      <figure class="gallery-item" data-cat="cooking">
        <button type="button" class="gallery-open" data-full="../images/w1600/soba1.webp">
          <img src="../images/w800/soba1.webp" width="600" height="800" alt="More soba" data-i18n-alt="g.3" loading="lazy" decoding="async">
        </button>
        <figcaption data-i18n="g.3">More soba</figcaption>
      </figure>
      <figure class="gallery-item" data-cat="cooking">
        <button type="button" class="gallery-open" data-full="../images/w1600/cook1.webp">
          <img src="../images/w800/cook1.webp" width="600" height="800" alt="From my kitchen, no. 1" data-i18n-alt="g.4" loading="lazy" decoding="async">
        </button>
        <figcaption data-i18n="g.4">From my kitchen, no. 1</figcaption>
      </figure>
      <figure class="gallery-item" data-cat="cooking">
        <button type="button" class="gallery-open" data-full="../images/w1600/cook2.webp">
          <img src="../images/w800/cook2.webp" width="600" height="800" alt="From my kitchen, no. 2" data-i18n-alt="g.5" loading="lazy" decoding="async">
        </button>
        <figcaption data-i18n="g.5">From my kitchen, no. 2</figcaption>
      </figure>
      <figure class="gallery-item" data-cat="cooking">
        <button type="button" class="gallery-open" data-full="../images/w1600/cook3.webp">
          <img src="../images/w800/cook3.webp" width="600" height="800" alt="From my kitchen, no. 3" data-i18n-alt="g.6" loading="lazy" decoding="async">
        </button>
        <figcaption data-i18n="g.6">From my kitchen, no. 3</figcaption>
      </figure>
      <figure class="gallery-item" data-cat="tech">
        <button type="button" class="gallery-open" data-full="../images/w1600/maytinh1.webp">
          <img src="../images/w800/maytinh1.webp" width="800" height="523" alt="A corner for working" data-i18n-alt="g.7" loading="lazy" decoding="async">
        </button>
        <figcaption data-i18n="g.7">A corner for working</figcaption>
      </figure>
      <figure class="gallery-item" data-cat="tech">
        <button type="button" class="gallery-open" data-full="../images/w1600/maytinh2.webp">
          <img src="../images/w800/maytinh2.webp" width="800" height="750" alt="A cow at the computer, with bubble tea" data-i18n-alt="g.8" loading="lazy" decoding="async">
        </button>
        <figcaption data-i18n="g.8">A cow at the computer, with bubble tea</figcaption>
      </figure>
      <figure class="gallery-item" data-cat="life">
        <button type="button" class="gallery-open" data-full="../images/w1600/anh1.webp">
          <img src="../images/w800/anh1.webp" width="600" height="800" alt="Window-shopping" data-i18n-alt="g.9" loading="lazy" decoding="async">
        </button>
        <figcaption data-i18n="g.9">Window-shopping</figcaption>
      </figure>
      <figure class="gallery-item" data-cat="life">
        <button type="button" class="gallery-open" data-full="../images/w1600/anh2.webp">
          <img src="../images/w800/anh2.webp" width="600" height="800" alt="Out and about in Koshigaya" data-i18n-alt="g.10" loading="lazy" decoding="async">
        </button>
        <figcaption data-i18n="g.10">Out and about in Koshigaya</figcaption>
      </figure>
      <figure class="gallery-item" data-cat="life">
        <button type="button" class="gallery-open" data-full="../images/w1600/avatar.webp">
          <img src="../images/w800/avatar.webp" width="600" height="800" alt="A winter walk" data-i18n-alt="g.11" loading="lazy" decoding="async">
        </button>
        <figcaption data-i18n="g.11">A winter walk</figcaption>
      </figure>
      <figure class="gallery-item" data-cat="life">
        <button type="button" class="gallery-open" data-full="../images/w1600/tansho1.webp">
          <img src="../images/w800/tansho1.webp" width="360" height="800" alt="A quiet moment" data-i18n-alt="g.12" loading="lazy" decoding="async">
        </button>
        <figcaption data-i18n="g.12">A quiet moment</figcaption>
      </figure>
      <figure class="gallery-item" data-cat="life">
        <button type="button" class="gallery-open" data-full="../images/w1600/tansho2.webp">
          <img src="../images/w800/tansho2.webp" width="600" height="800" alt="Lost in thought" data-i18n-alt="g.13" loading="lazy" decoding="async">
        </button>
        <figcaption data-i18n="g.13">Lost in thought</figcaption>
      </figure>
    </div>
  </main>

  <div class="lightbox" id="lightbox" hidden>
    <button type="button" class="lightbox-close" aria-label="Close" data-i18n-aria="gallery.close">&times;</button>
    <button type="button" class="lightbox-nav prev" aria-label="Previous photo" data-i18n-aria="gallery.prev">&lsaquo;</button>
    <img src="" alt="">
    <button type="button" class="lightbox-nav next" aria-label="Next photo" data-i18n-aria="gallery.next">&rsaquo;</button>
    <p class="lightbox-caption"></p>
    <p class="lightbox-count"></p>
  </div>

  <div id="footer"></div>
  <script src="../js/translations.js"></script>
  <script src="../js/i18n.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/pages.js"></script>
</body>

</html>
